# Render Blueprint — one-click backend + PostgreSQL.
# In Render: New ➜ Blueprint ➜ pick this repo. Render reads this file and
# provisions the web service + database. Then set CORS_ORIGINS to your Vercel URL.
#
# Note: the free web plan has 512MB RAM — enough for clinical/PCG/ECG screening,
# but the report-OCR feature needs more memory (set ENABLE_OCR_WARMUP stays
# false; bump to a Starter instance if you want live OCR).

services:
  - type: web
    name: cardiosense-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: ENABLE_OCR_WARMUP
        value: "false"               # keep boot light on 512MB
      - key: PROVISION_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cardiosense-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app

databases:
  - name: cardiosense-db
    plan: free
