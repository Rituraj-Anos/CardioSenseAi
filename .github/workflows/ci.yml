name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real-0123456789abcd
      PROVISION_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: System libs (audio + OpenMP)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 libgomp1

      - name: Install dependencies
        run: pip install --only-binary=:all: -r backend/requirements.txt

      - name: Ruff lint (non-blocking)
        run: pip install ruff && ruff check backend/app || true

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t cardiosense-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t cardiosense-frontend:ci .
